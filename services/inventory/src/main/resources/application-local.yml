spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./.data/inventory;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    default-schema: ${DATABASE_SCHEMA:public}
    schemas: ${DATABASE_SCHEMA:public}
app:
  auth-mode: local
  internal-token: ${INTERNAL_TOKEN:local-development-service-token-32-characters}
  workshop-url: ${WORKSHOP_URL:http://localhost:8082}
  vision-url: ${VISION_URL:http://localhost:8083}
  event-mode: http
