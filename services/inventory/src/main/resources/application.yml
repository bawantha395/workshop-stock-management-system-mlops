spring:
  application:
    name: inventory
  profiles:
    default: cloud
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    default-schema: ${DATABASE_SCHEMA:inventory}
    schemas: ${DATABASE_SCHEMA:inventory}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_TLS:false}
      connect-timeout: 300ms
      timeout: 300ms
server:
  port: 8081
  error:
    include-message: never
management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
app:
  auth-mode: ${AUTH_MODE:cognito}
  internal-token: ${INTERNAL_TOKEN}
  inventory-read-token: ${INVENTORY_READ_TOKEN:}
  inventory-control-token: ${INVENTORY_CONTROL_TOKEN:}
  cognito-issuer: ${COGNITO_ISSUER:}
  cognito-clients: ${COGNITO_CLIENT_IDS:}
  workshop-url: ${WORKSHOP_URL:http://workshop:8082}
  vision-url: ${VISION_URL:http://vision:8083}
  stock-queue: ${STOCK_QUEUE_URL:}
  catalogue-queue: ${CATALOGUE_QUEUE_URL:}
  event-mode: ${EVENT_MODE:sqs}
