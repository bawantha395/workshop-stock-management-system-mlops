server {
 listen 8080;
 server_tokens off;
 client_max_body_size 9m;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 location /api/inventory/ { proxy_pass http://inventory:8081; proxy_read_timeout 30s; }
 location /api/workshop/ { proxy_pass http://workshop:8082; proxy_read_timeout 30s; }
 location /api/vision/ { proxy_pass http://vision:8083; proxy_read_timeout 60s; }
 location /internal/ { return 404; }
 location = /config.js { add_header Cache-Control "no-store"; }
 location /assets/ { add_header Cache-Control "public,max-age=31536000,immutable"; }
 location / { try_files $uri $uri/ /index.html; }
}
