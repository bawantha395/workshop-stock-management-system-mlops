apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
      - name: grafana
        env:
        - name: GF_SERVER_ROOT_URL
          value: https://grafana-stocklane.bawantha-rathnayake.tech/
        - name: GF_SERVER_DOMAIN
          value: grafana-stocklane.bawantha-rathnayake.tech
        - name: GF_SECURITY_COOKIE_SECURE
          value: 'true'
