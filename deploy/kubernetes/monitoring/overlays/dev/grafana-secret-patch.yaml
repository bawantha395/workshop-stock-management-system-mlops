apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
  - secretKey: admin-user
    remoteRef:
      key: arn:aws:secretsmanager:ap-southeast-2:721274598579:secret:stocklane-dev/grafana/admin-ZD4XVg
      property: username
  - secretKey: admin-password
    remoteRef:
      key: arn:aws:secretsmanager:ap-southeast-2:721274598579:secret:stocklane-dev/grafana/admin-ZD4XVg
      property: password
