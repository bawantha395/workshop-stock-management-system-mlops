apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
    - name: Stocklane
      orgId: 1
      folder: Stocklane
      type: file
      disableDeletion: false
      editable: false
      options:
        path: /var/lib/grafana/dashboards
