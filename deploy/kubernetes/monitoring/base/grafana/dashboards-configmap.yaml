apiVersion: v1
kind: ConfigMap
metadata:
  name: stocklane-dashboards
data:
  stocklane.json: |-
    {
      "title": "Stocklane - workshop platform",
      "uid": "stocklane-platform",
      "schemaVersion": 39,
      "version": 1,
      "tags": [
        "stocklane",
        "mlops"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Vision HTTP requests / second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (route) (rate(stocklane_http_requests_total[5m]))"
            }
          ]
        },
        {
          "id": 2,
          "title": "Vision p95 request time",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(stocklane_http_request_seconds_bucket[5m])))"
            }
          ]
        },
        {
          "id": 3,
          "title": "Java API requests / second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (application) (rate(http_server_requests_seconds_count{namespace=~\"stocklane(-.*)?\"}[5m]))"
            }
          ]
        },
        {
          "id": 4,
          "title": "Vision server errors / second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(stocklane_http_requests_total{status=~\"5..\"}[5m]))"
            }
          ]
        },
        {
          "id": 5,
          "title": "Embedding cache hit ratio",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(stocklane_embedding_cache_total{result=\"hit\"}[5m])) / clamp_min(sum(rate(stocklane_embedding_cache_total{result=~\"hit|miss\"}[5m])),0.001)"
            }
          ]
        },
        {
          "id": 6,
          "title": "Application pod restarts",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"stocklane(-.*)?\"}[15m]))"
            }
          ]
        },
        {
          "id": 7,
          "title": "Java heap in use",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (application) (jvm_memory_used_bytes{namespace=~\"stocklane(-.*)?\",area=\"heap\"})"
            }
          ]
        },
        {
          "id": 8,
          "title": "API availability / scrape health",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{namespace=~\"stocklane(-.*)?\"}"
            }
          ]
        }
      ]
    }
