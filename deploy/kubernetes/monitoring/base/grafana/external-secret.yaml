apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
  - secretKey: admin-user
    remoteRef:
      key: REPLACE_GRAFANA_SECRET_ARN
      property: username
  - secretKey: admin-password
    remoteRef:
      key: REPLACE_GRAFANA_SECRET_ARN
      property: password
