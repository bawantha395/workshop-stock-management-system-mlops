apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: stocklane
spec:
  replicas: 3
  image: quay.io/prometheus/alertmanager:v0.34.1
  version: v0.34.1
  serviceAccountName: stocklane-alertmanager
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: alertmanager
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            alertmanager: stocklane
        topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: gp3
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  configSecret: alertmanager-stocklane
