apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stocklane
  labels:
    stocklane.io/monitoring: enabled
spec:
  groups:
  - name: stocklane-application
    rules:
    - alert: StocklaneScrapeUnavailable
      expr: up{namespace=~"stocklane(-.*)?"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Stocklane application metrics endpoint unavailable
    - alert: StocklaneVisionServerErrors
      expr: sum(rate(stocklane_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(stocklane_http_requests_total[5m])),
        0.001) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Vision server error ratio exceeds five percent
    - alert: StocklaneJavaServerErrors
      expr: sum by (application) (rate(http_server_requests_seconds_count{namespace=~"stocklane(-.*)?",status=~"5.."}[5m]))
        / clamp_min(sum by (application) (rate(http_server_requests_seconds_count{namespace=~"stocklane(-.*)?"}[5m])), 0.001)
        > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Spring Boot server error ratio exceeds five percent
