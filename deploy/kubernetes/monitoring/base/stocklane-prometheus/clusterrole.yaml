apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stocklane-prometheus
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - services
  - endpoints
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  verbs:
  - get
