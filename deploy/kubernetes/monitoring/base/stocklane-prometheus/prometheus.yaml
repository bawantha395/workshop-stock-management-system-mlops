apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: stocklane
spec:
  replicas: 2
  image: quay.io/prometheus/prometheus:v3.15.1
  version: v3.15.1
  serviceAccountName: stocklane-prometheus
  retention: 7d
  retentionSize: 15GB
  replicaExternalLabelName: ''
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: prometheus
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            prometheus: stocklane
        topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 2Gi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: gp3
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
  serviceMonitorSelector:
    matchLabels:
      stocklane.io/monitoring: enabled
  serviceMonitorNamespaceSelector:
    matchLabels:
      stocklane.io/monitoring: enabled
  ruleSelector:
    matchLabels:
      stocklane.io/monitoring: enabled
  ruleNamespaceSelector:
    matchLabels:
      stocklane.io/monitoring: enabled
  alerting:
    alertmanagers:
    - namespace: monitoring
      name: alertmanager
      port: http
