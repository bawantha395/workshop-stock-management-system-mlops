apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stocklane-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bawantha395/workshop-stock-management--system-mlops.git
    targetRevision: main
    path: deploy/kubernetes/argocd/applications/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
