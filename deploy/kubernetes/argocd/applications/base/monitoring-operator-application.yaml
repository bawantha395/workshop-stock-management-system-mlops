apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stocklane-monitoring-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  project: stocklane-platform
  source:
    repoURL: https://github.com/bawantha395/workshop-stock-management-system-mlops.git
    targetRevision: main
    path: deploy/kubernetes/monitoring-operator/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
