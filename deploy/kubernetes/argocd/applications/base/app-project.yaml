apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: stocklane-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  sourceRepos:
  - https://github.com/bawantha395/workshop-stock-management--system-mlops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: stocklane
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: apps
    kind: Deployment
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: policy
    kind: PodDisruptionBudget
  - group: networking.k8s.io
    kind: Ingress
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: external-secrets.io
    kind: ExternalSecret
  - group: monitoring.coreos.com
    kind: ServiceMonitor
  - group: batch
    kind: Job
