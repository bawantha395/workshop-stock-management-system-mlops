apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: amazon-cloudwatch
spec:
  template:
    spec:
      containers:
      - name: fluent-bit
        env:
        - name: AWS_REGION
          value: ap-southeast-2
        - name: LOG_GROUP_NAME
          value: /stocklane/stocklane-dev/containers
