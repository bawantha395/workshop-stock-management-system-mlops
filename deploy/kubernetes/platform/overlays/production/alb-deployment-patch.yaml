apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  template:
    spec:
      containers:
      - name: controller
        args:
        - --ingress-class=alb
        - --enable-shield=false
        - --enable-waf=false
        - --enable-wafv2=false
        - --cluster-name=REPLACE_CLUSTER_NAME
        - --aws-region=REPLACE_AWS_REGION
        - --aws-vpc-id=REPLACE_VPC_ID
