apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../vendor/cert-manager
- ../../vendor/external-secrets
- ../../vendor/aws-load-balancer-controller
- ../../vendor/metrics-server
- cloudwatch-namespace.yaml
- external-secrets-namespace.yaml
- fluent-bit-clusterrole.yaml
- fluent-bit-clusterrolebinding.yaml
- fluent-bit-configmap.yaml
- fluent-bit-daemonset.yaml
- fluent-bit-serviceaccount.yaml
- secretstore.yaml
- storageclass.yaml
patches:
# The pinned high-availability bundle still declares the removed beta PDB API.
# Apply this compatibility fix to every environment without changing vendor pins.
- target:
    group: policy
    kind: PodDisruptionBudget
    name: metrics-server
    namespace: kube-system
  patch: |-
    - op: replace
      path: /apiVersion
      value: policy/v1
