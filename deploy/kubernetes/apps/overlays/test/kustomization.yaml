apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- namespace.yaml
namespace: stocklane-test
patches:
- path: patches/configmap.yaml
- path: patches/inventory-deployment.yaml
- path: patches/inventory-hpa.yaml
- path: patches/inventory-pdb.yaml
- path: patches/workshop-deployment.yaml
- path: patches/workshop-hpa.yaml
- path: patches/workshop-pdb.yaml
- path: patches/vision-deployment.yaml
- path: patches/vision-hpa.yaml
- path: patches/vision-pdb.yaml
labels:
- pairs:
    stocklane.io/environment: test
  includeSelectors: false
