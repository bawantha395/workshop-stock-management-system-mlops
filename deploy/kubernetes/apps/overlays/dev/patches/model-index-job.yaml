apiVersion: batch/v1
kind: Job
metadata:
  name: prepare-model-index
spec:
  template:
    spec:
      initContainers:
      - name: fetch-model
        env:
        - &id001
          name: AUTH_MODE
          value: cognito
        - &id002
          name: ENVIRONMENT
          value: cloud
        - &id003
          name: SPRING_PROFILES_ACTIVE
          value: cloud
        - &id004
          name: AWS_REGION
          value: ap-southeast-2
        - &id005
          name: COGNITO_ISSUER
          value: https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_flNc3H9kV
        - &id006
          name: COGNITO_CLIENT_IDS
          value: 5e3g95pok2v5n410s6h8t8dd89,3ju0vetvcb4ph78kq413p6jh18
        - &id007
          name: APP_WEB_ORIGIN
          value: https://stocklane.bawantha-rathnayake.tech
        - &id008
          name: WEB_ORIGIN
          value: https://stocklane.bawantha-rathnayake.tech
        - &id009
