          value: /tmp/files
        - &id022
          name: BEDROCK_MODEL_ID
          value: amazon.nova-lite-v1:0
        - &id023
          name: BEDROCK_REGION
          value: us-east-1
        - &id024
          name: TEXTRACT_FALLBACK
          value: 'true'
        - &id025
          name: TRAINING_EXPORT
          value: 'true'
        - &id026
          name: DEPLOYMENT_ENVIRONMENT
          value: dev
        - &id027
          name: MODEL_BUCKET
          value: stocklane-dev-models-721274598579
        - &id028
          name: BEDROCK_DAILY_REQUEST_LIMIT
