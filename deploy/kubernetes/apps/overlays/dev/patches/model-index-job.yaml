          value: https://sqs.ap-southeast-2.amazonaws.com/721274598579/stocklane-dev-catalogue
        - &id014
          name: EVENT_MODE
          value: sqs
        - &id015
          name: REDIS_HOST
          value: master.stocklane-dev.g3lygp.apse2.cache.amazonaws.com
        - &id016
          name: REDIS_TLS
          value: 'true'
        - &id017
          name: MEDIA_BUCKET
          value: stocklane-dev-media-721274598579
        - &id018
          name: MODEL_DIR
          value: /models/current
        - &id019
          name: MODEL_URI
          value: s3://stocklane-dev-models-721274598579/releases/baseline/93852561615f32a7738b5820748c96a9183c32858b737fac4a63ea98610e90ec.tar.gz
        - &id020
