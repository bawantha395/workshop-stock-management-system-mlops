          value: vision
        - name: PYTHONPATH
          value: /app
        - name: REDIS_URL
          value: rediss://:$(REDIS_PASSWORD)@$(REDIS_HOST):6379/0?ssl_cert_reqs=required&ssl_check_hostname=true
