          value: 5gds0d8ucnj3o123834fsdr123,2t6a6tvlvdaprqo6tfboq6e89o
        - &id007
          name: APP_WEB_ORIGIN
          value: https://d2lnni381bgho5.cloudfront.net
        - &id008
          name: WEB_ORIGIN
          value: https://d2lnni381bgho5.cloudfront.net
        - &id009
