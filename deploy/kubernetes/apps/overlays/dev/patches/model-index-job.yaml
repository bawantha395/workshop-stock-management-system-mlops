        - *id008
        - *id009
        - *id010
        - *id011
        - *id012
        - *id013
        - *id014
        - *id015
        - *id016
        - *id017
        - *id018
        - *id019
        - *id020
        - *id021
        - *id022
        - *id023
        - *id024
        - *id025
        - *id026
        - *id027
        - *id028
        - name: DATABASE_SCHEMA
          value: vision
        - name: PYTHONPATH
          value: /app
        - name: REDIS_URL
          value: rediss://:$(REDIS_PASSWORD)@$(REDIS_HOST):6379/0?ssl_cert_reqs=required&ssl_check_hostname=true
