        - &id016
          name: REDIS_TLS
          value: 'true'
        - &id017
          name: MEDIA_BUCKET
          value: stocklane-dev-media-721274598579
        - &id018
          name: MODEL_DIR
          value: /models/current
        - &id019
          name: MODEL_URI
          value: s3://stocklane-dev-models-721274598579/releases/baseline/30a174a801e8dcc0cc1b49096255f9868e677b638627019590b8913317c27c2c.tar.gz
