apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-2:721274598579:certificate/856de45e-0bc8-4299-ad10-4cc9400f980e
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true
spec:
  ingressClassName: alb
  rules:
  - host: api.stocklane.bawantha-rathnayake.tech
    http:
      paths:
      - path: /api/inventory
        pathType: Prefix
        backend:
          service:
            name: inventory
            port:
              number: 8081
      - path: /api/workshop
        pathType: Prefix
        backend:
          service:
            name: workshop
            port:
              number: 8082
      - path: /api/vision
        pathType: Prefix
        backend:
          service:
            name: vision
            port:
              number: 8083
