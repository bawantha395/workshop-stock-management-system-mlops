apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workshop-to-inventory-service
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - workshop
      - vision
      - vision-index
      - forecast
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: inventory
    - ipBlock:
        cidr: 172.20.0.0/16
    ports:
    - protocol: TCP
      port: 8081
