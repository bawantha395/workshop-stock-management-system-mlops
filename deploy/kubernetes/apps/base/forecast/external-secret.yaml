apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forecast-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: forecast-secrets
    template:
      engineVersion: v2
      data:
        INVENTORY_READ_TOKEN: '{{ .INVENTORY_READ_TOKEN }}'
        INTERNAL_TOKEN: '{{ .INTERNAL_TOKEN }}'
  data:
  - secretKey: INVENTORY_READ_TOKEN
    remoteRef:
      key: REPLACE_PLATFORM_SECRET_ARN
      property: INVENTORY_READ_TOKEN
  - secretKey: INTERNAL_TOKEN
    remoteRef:
      key: REPLACE_PLATFORM_SECRET_ARN
      property: INTERNAL_TOKEN
