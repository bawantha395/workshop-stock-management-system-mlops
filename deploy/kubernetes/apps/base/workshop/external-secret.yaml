apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workshop-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: workshop-secrets
    template:
      engineVersion: v2
      data:
        INVENTORY_CONTROL_TOKEN: '{{ .INVENTORY_CONTROL_TOKEN }}'
        INTERNAL_TOKEN: '{{ .INTERNAL_TOKEN }}'
        REDIS_PASSWORD: '{{ .REDIS_PASSWORD }}'
        DATABASE_PASSWORD: '{{ .password }}'
        DATABASE_USER: '{{ .username }}'
        DATABASE_URL: jdbc:postgresql://{{ .host }}:5432/{{ .dbname }}?currentSchema=workshop&sslmode=verify-full&sslrootcert=/app/certs/rds-global-bundle.pem
  data:
  - secretKey: username
    remoteRef:
      key: REPLACE_WORKSHOP_DATABASE_SECRET_ARN
      property: username
  - secretKey: password
    remoteRef:
      key: REPLACE_WORKSHOP_DATABASE_SECRET_ARN
      property: password
  - secretKey: host
    remoteRef:
      key: REPLACE_WORKSHOP_DATABASE_SECRET_ARN
      property: host
  - secretKey: dbname
    remoteRef:
      key: REPLACE_WORKSHOP_DATABASE_SECRET_ARN
      property: dbname
  - secretKey: INTERNAL_TOKEN
    remoteRef:
      key: REPLACE_PLATFORM_SECRET_ARN
      property: INTERNAL_TOKEN
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: REPLACE_PLATFORM_SECRET_ARN
      property: REDIS_PASSWORD
  - secretKey: INVENTORY_CONTROL_TOKEN
    remoteRef:
      key: REPLACE_PLATFORM_SECRET_ARN
      property: INVENTORY_CONTROL_TOKEN
