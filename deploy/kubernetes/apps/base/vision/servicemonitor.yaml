apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vision
  labels:
    stocklane.io/monitoring: enabled
spec:
  selector:
    matchLabels:
      app: vision
  endpoints:
  - port: http
    path: /metrics
    authorization:
      type: Bearer
      credentials:
        name: vision-secrets
        key: INTERNAL_TOKEN
