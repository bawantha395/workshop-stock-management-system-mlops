apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  AUTH_MODE: cognito
  ENVIRONMENT: cloud
  SPRING_PROFILES_ACTIVE: cloud
  AWS_REGION: REPLACE_AWS_REGION
  COGNITO_ISSUER: https://REPLACE_COGNITO_ISSUER
  COGNITO_CLIENT_IDS: REPLACE_WEB_CLIENT_ID,REPLACE_CAMERA_CLIENT_ID
  APP_WEB_ORIGIN: https://REPLACE_FRONTEND_HOST
  WEB_ORIGIN: https://REPLACE_FRONTEND_HOST
  INVENTORY_URL: http://inventory:8081
  WORKSHOP_URL: http://workshop:8082
  VISION_URL: http://vision:8083
  STOCK_QUEUE_URL: https://REPLACE_STOCK_QUEUE
  CATALOGUE_QUEUE_URL: https://REPLACE_CATALOGUE_QUEUE
  EVENT_MODE: sqs
  REDIS_HOST: REPLACE_CACHE_HOST
  REDIS_TLS: 'true'
  MEDIA_BUCKET: REPLACE_MEDIA_BUCKET
  MODEL_DIR: /models/current
  MODEL_URI: s3://REPLACE_MODEL_BUCKET/REPLACE_MODEL_KEY
  MODEL_ARCHIVE_SHA256: REPLACE_MODEL_ARCHIVE_SHA256
  FILES_ROOT: /tmp/files
  BEDROCK_MODEL_ID: ''
  BEDROCK_REGION: ''
  TEXTRACT_FALLBACK: 'true'
  TRAINING_EXPORT: 'true'
  DEPLOYMENT_ENVIRONMENT: REPLACE_ENVIRONMENT
