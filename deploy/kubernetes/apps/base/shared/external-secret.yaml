apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vision-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: vision-secrets
    template:
      engineVersion: v2
      data:
        INVENTORY_READ_TOKEN: '{{ .INVENTORY_READ_TOKEN }}'
        VISION_READ_TOKEN: '{{ .VISION_READ_TOKEN }}'
        INTERNAL_TOKEN: '{{ .INTERNAL_TOKEN }}'
        REDIS_PASSWORD: '{{ .REDIS_PASSWORD }}'
        DATABASE_URL: jdbc:postgresql://{{ .host }}:5432/{{ .dbname }}?currentSchema=vision-secrets&sslmode=verify-full&sslrootcert=/app/certs/rds-global-bundle.pem
        REDIS_URL: rediss://:{{ .REDIS_PASSWORD }}@REPLACE_CACHE_HOST:6379/0?ssl_cert_reqs=required&ssl_check_hostname=true
        DATABASE_USER: '{{ .username }}'
  data:
  - secretKey: username
    remoteRef:
      key: REPLACE_VISION_DATABASE_SECRET_ARN
      property: username
  - secretKey: password
    remoteRef:
      key: REPLACE_VISION_DATABASE_SECRET_ARN
      property: password
  - secretKey: host
    remoteRef:
      key: REPLACE_VISION_DATABASE_SECRET_ARN
      property: host
  - secretKey: dbname
    remoteRef:
      key: REPLACE_VISION_DATABASE_SECRET_ARN
      property: dbname
  - secretKey: INTERNAL_TOKEN
    remoteRef:
      key: REPLACE_PLATFORM_SECRET_ARN
      property: INTERNAL_TOKEN
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: REPLACE_PLATFORM_SECRET_ARN
      property: REDIS_PASSWORD
  - secretKey: INVENTORY_READ_TOKEN
    remoteRef:
      key: REPLACE_PLATFORM_SECRET_ARN
      property: INVENTORY_READ_TOKEN
  - secretKey: VISION_READ_TOKEN
    remoteRef:
      key: REPLACE_PLATFORM_SECRET_ARN
      property: VISION_READ_TOKEN
