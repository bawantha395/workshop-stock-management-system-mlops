apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inventory
  labels:
    stocklane.io/monitoring: enabled
spec:
  selector:
    matchLabels:
      app: inventory
  endpoints:
  - port: http
    path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials:
        name: inventory-secrets
        key: INTERNAL_TOKEN
