apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: stocklane
  namespace: monitoring
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            alertmanager: stocklane
        topologyKey: kubernetes.io/hostname
  configSecret: alertmanager-stocklane
  containers:
  - name: alertmanager
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
  image: quay.io/prometheus/alertmanager:v0.34.1
  replicas: {{ .Values.monitoring.alertmanager.replicas }}
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 96Mi
  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: stocklane-alertmanager
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: gp3
  version: v0.34.1
