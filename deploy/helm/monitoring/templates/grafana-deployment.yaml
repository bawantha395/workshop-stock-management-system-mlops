# Grafana reads its provisioning files only at start-up, so the pod template carries a checksum of them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        stocklane.io/provisioning-sha256: {{ print (.Files.Get "files/configmap-monitoring-grafana-datasources.yaml") (.Files.Get "files/configmap-monitoring-grafana-dashboard-provider.yaml") | sha256sum }}
      labels:
        app: grafana
    spec:
      containers:
      - env:
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: admin-user
              name: grafana-admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: grafana-admin
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_LOG_MODE
          value: console
        - name: GF_METRICS_ENABLED
          value: 'true'
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: 'true'
{{- if .Values.monitoring.grafanaDomain }}
        - name: GF_SERVER_ROOT_URL
          value: https://{{ .Values.monitoring.grafanaDomain }}/
        - name: GF_SERVER_DOMAIN
          value: {{ .Values.monitoring.grafanaDomain }}
        - name: GF_SECURITY_COOKIE_SECURE
          value: "true"
{{- end }}
        image: grafana/grafana:13.2.4
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
        name: grafana
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: data
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/grafana/provisioning/datasources
          name: datasources
          readOnly: true
        - mountPath: /etc/grafana/provisioning/dashboards
          name: providers
          readOnly: true
        - mountPath: /var/lib/grafana/dashboards
          name: dashboards
          readOnly: true
      securityContext:
        fsGroup: 472
        runAsGroup: 472
        runAsNonRoot: true
        runAsUser: 472
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: grafana
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - emptyDir: {}
        name: tmp
      - configMap:
          name: grafana-datasources
        name: datasources
      - configMap:
          name: grafana-dashboard-provider
        name: providers
      - configMap:
          name: stocklane-dashboards
        name: dashboards
