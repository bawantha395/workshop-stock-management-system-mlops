apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: stocklane
  namespace: monitoring
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            prometheus: stocklane
        topologyKey: kubernetes.io/hostname
  alerting:
    alertmanagers:
    - name: alertmanager
      namespace: monitoring
      port: http
  containers:
  - name: prometheus
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
  image: quay.io/prometheus/prometheus:v3.15.1
  replicaExternalLabelName: ''
  replicas: {{ .Values.monitoring.prometheus.replicas }}
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 768Mi
  retention: 7d
  retentionSize: 15GB
  ruleNamespaceSelector:
    matchLabels:
      stocklane.io/monitoring: enabled
  ruleSelector:
    matchLabels:
      stocklane.io/monitoring: enabled
  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: stocklane-prometheus
  serviceMonitorNamespaceSelector:
    matchLabels:
      stocklane.io/monitoring: enabled
  serviceMonitorSelector:
    matchLabels:
      stocklane.io/monitoring: enabled
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: gp3
  version: v3.15.1
