apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  data:
  - remoteRef:
      key: '{{ .Values.monitoring.grafanaSecretArn }}'
      property: username
    secretKey: admin-user
  - remoteRef:
      key: '{{ .Values.monitoring.grafanaSecretArn }}'
      property: password
    secretKey: admin-password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: grafana-admin
