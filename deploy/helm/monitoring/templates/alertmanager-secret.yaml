{{- /* Alertmanager sends every alert to the operations SNS topic. */ -}}
{{- $topic := dict "topic_arn" .Values.monitoring.operationsTopicArn "sigv4" (dict "region" .Values.monitoring.region) "send_resolved" true }}
{{- $config := dict "global" (dict "resolve_timeout" "5m") "route" (dict "receiver" "operations" "group_by" (list "namespace" "alertname") "group_wait" "30s" "group_interval" "5m" "repeat_interval" "4h") "receivers" (list (dict "name" "operations" "sns_configs" (list $topic))) }}
apiVersion: v1
data:
  alertmanager.yaml: '{{ toYaml $config | b64enc }}'
kind: Secret
metadata:
  name: alertmanager-stocklane
  namespace: monitoring
type: Opaque
