{{- /* Optional ALB routes for the Argo CD and Grafana admin pages, restricted to the allowed CIDRs. */ -}}
{{- $admin := .Values.platform.admin }}
{{- range $name, $target := $admin.targets }}
{{- $host := index $admin.hosts $name }}
{{- if $host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-{{ $name }}
  namespace: {{ $target.namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: {{ $.Values.platform.name }}-admin
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ required "platform.admin.certificateArn is required when an admin domain is set" $admin.certificateArn }}
    alb.ingress.kubernetes.io/inbound-cidrs: {{ join "," $admin.allowedCidrs }}
    alb.ingress.kubernetes.io/backend-protocol: {{ $target.protocol }}
    alb.ingress.kubernetes.io/healthcheck-protocol: {{ $target.protocol }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ $target.healthPath }}
spec:
  ingressClassName: alb
  rules:
  - host: {{ $host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $target.service }}
            port:
              number: {{ $target.port }}
{{- end }}
{{- end }}
