apiVersion: v1
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 5
        Log_Level info
        Parsers_File parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Exclude_Path /var/log/containers/fluent-bit*
        Tag kube.*
        Parser cri
        DB /var/fluent-bit/state/tail.db
        Mem_Buf_Limit 20MB
        Skip_Long_Lines On
        Read_from_Head Off
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_URL https://kubernetes.default.svc:443
        Merge_Log On
        Keep_Log Off
    [OUTPUT]
        Name cloudwatch_logs
        Match kube.*
        region ${AWS_REGION}
        log_group_name ${LOG_GROUP_NAME}
        log_stream_prefix ${NODE_NAME}/
        auto_create_group false
  parsers.conf: |
    [PARSER]
        Name cri
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<_p>[^ ]*) (?<log>.*)$
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: amazon-cloudwatch
