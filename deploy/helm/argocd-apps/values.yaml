# Written per environment by scripts/render_cloud.py (deploy/helm/values/<environment>.yaml).
gitops:
  repoURL: https://github.com/OWNER/REPOSITORY.git
  targetRevision: main
  namespace: ""                  # where the application workloads run; defaults to stocklane-<environment>
  # Sync order: platform controllers (0), Prometheus Operator (10), monitoring (20), the application (30).
  applications:
    platform:
      project: platform
      chart: platform
      wave: "0"
      namespace: kube-system
    monitoring-operator:
      project: platform
      chart: monitoring-operator
      wave: "10"
      namespace: monitoring
    monitoring:
      project: platform
      chart: monitoring
      wave: "20"
      namespace: monitoring
    workshop:
      project: app
      chart: stocklane
      wave: "30"
      namespace: ""               # defaults to gitops.namespace
