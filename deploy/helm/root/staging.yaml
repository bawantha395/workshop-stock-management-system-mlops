apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stocklane-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bawantha395/workshop-stock-management-system-mlops.git
    targetRevision: main
    path: deploy/helm/argocd-apps
    helm:
      valueFiles:
      - ../values/staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
