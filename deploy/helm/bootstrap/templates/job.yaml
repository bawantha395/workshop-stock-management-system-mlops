apiVersion: batch/v1
kind: Job
metadata:
  name: database-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: database-bootstrap-config
        image: {{ .Values.bootstrap.image }}
        name: bootstrap
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: database-bootstrap
      volumes:
      - emptyDir: {}
        name: tmp
  ttlSecondsAfterFinished: 86400
