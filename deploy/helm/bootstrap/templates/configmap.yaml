apiVersion: v1
kind: ConfigMap
metadata:
  name: database-bootstrap-config
  namespace: {{ .Release.Namespace }}
data:
  AWS_REGION: {{ .Values.bootstrap.region | quote }}
  DATABASE_HOST: {{ .Values.bootstrap.databaseHost | quote }}
  MASTER_SECRET_ARN: {{ .Values.bootstrap.masterSecretArn | quote }}
  DATABASE_SECRETS: {{ .Values.bootstrap.databaseSecrets | quote }}
