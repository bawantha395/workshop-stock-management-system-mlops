# Default boundary for every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-boundaries
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stocklane.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: {{ .Values.vpcCidr }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 8084
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: {{ .Values.vpcCidr }}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 8083
  - ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 169.254.170.23/32
    ports:
    - protocol: TCP
      port: 80
---
# Egress can be evaluated before Service DNAT, so the Service range is allowed as well as Inventory pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workshop-to-inventory-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stocklane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - workshop
      - vision
      - vision-index
      - forecast
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: inventory
    - ipBlock:
        cidr: {{ .Values.serviceCidr }}
    ports:
    - protocol: TCP
      port: 8081
