name: Train reviewed workshop model
on:
  workflow_dispatch:
    inputs:
      dataset_uri:
        description: Versioned S3 dataset prefix with manifest.csv and reviewed photos
        required: true
      encoder_uri:
        description: S3 prefix containing encoder.onnx and model.json
        required: true
      training_image:
        description: Published ml-training ECR image with @sha256 digest
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-training
  cancel-in-progress: false
env:
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT || 'dev' }}
jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-training
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Authenticate to AWS with GitHub OIDC
        if: vars.AWS_AUTH_MODE != 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-github-training', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Assume delivery role with restricted CI user
        if: vars.AWS_AUTH_MODE == 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-github-training', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          force-skip-oidc: true
          role-skip-session-tagging: true
          role-session-name: stocklane-${{ github.run_id }}
      - run: pip install boto3==1.43.118
      - run: python scripts/pipeline_common.py --output artifacts/aws.json
      - name: Train, evaluate and register pending approval
        env:
          DATASET_URI: ${{ inputs.dataset_uri }}
          ENCODER_URI: ${{ inputs.encoder_uri }}
          TRAINING_IMAGE: ${{ inputs.training_image }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          c = json.load(open('artifacts/aws.json'))['deployment']['value']
          subprocess.run(['python', 'mlops/run_training.py', '--region', c['region'],
              '--name', c['name'], '--role', c['training_role_arn'],
              '--image', os.environ['TRAINING_IMAGE'], '--dataset', os.environ['DATASET_URI'],
              '--encoder', os.environ['ENCODER_URI'], '--output', 's3://' + c['model_bucket'] + '/training',
              '--group', c['model_package_group']], check=True)
          PY
