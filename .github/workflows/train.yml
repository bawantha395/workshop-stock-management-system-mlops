name: Train reviewed workshop model
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      dataset_uri:
        description: Versioned S3 dataset prefix with manifest.csv and reviewed photos
        required: true
      encoder_uri:
        description: Optional staged encoder prefix; empty stages the approved release encoder
        required: false
      training_image:
        description: Optional pinned image; empty uses the approved ml-training image
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-training-${{ inputs.environment }}
  cancel-in-progress: false
env:
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: stocklane-${{ inputs.environment }}
  TF_ENVIRONMENT: ${{ inputs.environment }}
jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-training
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: ./.github/actions/aws-credentials
        with:
          role: github-training
          access-key-id: ${{ inputs.environment == 'prod' && secrets.AWS_ACCESS_KEY_ID_PROD || inputs.environment == 'staging' && secrets.AWS_ACCESS_KEY_ID_STAGING || secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ inputs.environment == 'prod' && secrets.AWS_SECRET_ACCESS_KEY_PROD || inputs.environment == 'staging' && secrets.AWS_SECRET_ACCESS_KEY_STAGING || secrets.AWS_SECRET_ACCESS_KEY }}
      - run: pip install boto3==1.43.118
      - run: python scripts/pipeline_common.py --output artifacts/aws.json
      - name: Train, evaluate and register pending approval
        env:
          DATASET_URI: ${{ inputs.dataset_uri }}
          ENCODER_URI: ${{ inputs.encoder_uri }}
          TRAINING_IMAGE: ${{ inputs.training_image }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, boto3
          from pathlib import Path
          sys.path.insert(0,"mlops")
          from stage_encoder import stage
          c = json.load(open('artifacts/aws.json'))['deployment']['value']
          overlay=Path('deploy/kubernetes/apps/overlays')/c['environment']
          encoder=os.environ['ENCODER_URI'] or stage(json.loads((overlay/'release.json').read_text()),c['model_bucket'],boto3.client('s3',region_name=c['region']))
          image=os.environ['TRAINING_IMAGE'] or json.loads((overlay/'images.json').read_text())['ml-training']
          subprocess.run(['python', 'mlops/run_training.py', '--region', c['region'],
              '--name', c['name'], '--role', c['training_role_arn'],
              '--image', image, '--dataset', os.environ['DATASET_URI'],
              '--encoder', encoder, '--output', 's3://' + c['model_bucket'] + '/training',
              '--group', c['model_package_group'], '--report', 'artifacts/training-report.json'], check=True)
          PY
      - name: Publish training result in summary
        if: success()
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('artifacts/training-report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Model awaiting review\n\n`'+r['modelPackageArn']+'`\n\n')
              f.write('Review validation and test metrics before running **Review SageMaker model**.\n\n```json\n'+json.dumps(r['metrics'],indent=2)+'\n```\n')
          PY
