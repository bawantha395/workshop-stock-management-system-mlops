name: Release approved model
# Started by the training workflows after an automatic approval: commits the model to the
# environment's GitOps values, and Argo CD rolls it out. It can also be run by hand.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      model_package:
        description: Approved Model Registry version ARN to serve
        type: string
        required: true
permissions:
  contents: write
  id-token: write
concurrency:
  group: stocklane-aws
  cancel-in-progress: false
jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      environment: ${{ inputs.environment }}
      model_package: ${{ inputs.model_package }}
    secrets: inherit
