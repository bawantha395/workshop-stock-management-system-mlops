name: Prepare AWS release
on:
  workflow_dispatch:
    inputs:
      model_package_arn:
        description: Approved package ARN; empty retains the reviewed model, or uses baseline initially
        required: false
        type: string
  workflow_run:
    workflows: [Validate platform]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aws-release
  cancel-in-progress: false
env:
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT || 'dev' }}
  STOCKLANE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  eligibility:
    if: >-
      vars.AWS_ACCOUNT_ID != '' && vars.PROJECT_NAME != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ env.STOCKLANE_SOURCE_SHA }}', fetch-depth: 2}
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/workflow_eligibility.py --kind application
  release:
    needs: eligibility
    if: github.ref == 'refs/heads/main' && needs.eligibility.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: aws-release
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ env.STOCKLANE_SOURCE_SHA }}'}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22'}
      - name: Authenticate to AWS with GitHub OIDC
        if: vars.AWS_AUTH_MODE != 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-github-release', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Assume delivery role with restricted CI user
        if: vars.AWS_AUTH_MODE == 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-github-release', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          force-skip-oidc: true
          role-skip-session-tagging: true
          role-session-name: stocklane-${{ github.run_id }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: pip install -r services/vision/requirements-dev.txt PyYAML==6.0.3
      - run: python scripts/install_kustomize.py --directory "$RUNNER_TEMP/stocklane-tools"
      - run: pip install -r scripts/requirements.txt
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: {terraform_version: '1.13.5', terraform_wrapper: false}
      - run: python scripts/download_model.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - run: pip install PyYAML==6.0.3 fakeredis==2.40.0 scikit-learn==1.9.1
      - run: PYTHONPATH=services/vision pytest services/vision/tests tests -q
      - name: Read deployment outputs published by Terraform
        run: python scripts/pipeline_common.py --output artifacts/aws.json
      - name: Sign in to this account's ECR
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - name: Build and prepare immutable release
        env:
          MODEL_PACKAGE: ${{ inputs.model_package_arn }}
        run: python scripts/build_release.py --config artifacts/aws.json --model-package "$MODEL_PACKAGE"
      - id: gitops
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: gitops/release-${{ github.run_id }}
          title: Deploy reviewed Stocklane build ${{ env.STOCKLANE_SOURCE_SHA }}
          body-path: artifacts/release/summary.md
          commit-message: 'release: update Stocklane image digests and model bundle'
          add-paths: deploy/kubernetes
          delete-branch: true
      - name: Validate the generated GitOps branch
        if: steps.gitops.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "gitops/release-$GITHUB_RUN_ID"
