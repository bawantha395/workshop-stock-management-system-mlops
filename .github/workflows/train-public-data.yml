# Trains the photo matcher and the stock forecaster on real public data as
# SageMaker Processing jobs, then registers each candidate in the Model
# Registry as PendingManualApproval. Run alone, or from Deploy with train=true.
name: Train real-data ML models
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      task:
        description: Real public-data training; workshop production promotion is separate
        type: choice
        options: [both, photo, forecast]
        default: both
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      task: {type: string, default: both}
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-training-${{ inputs.environment }}
  cancel-in-progress: false
env:
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: stocklane-${{ inputs.environment }}
  TF_ENVIRONMENT: ${{ inputs.environment }}
jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-training
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: ./.github/actions/aws-credentials
        with:
          role: github-training
          access-key-id: ${{ inputs.environment == 'prod' && secrets.AWS_ACCESS_KEY_ID_PROD || inputs.environment == 'staging' && secrets.AWS_ACCESS_KEY_ID_STAGING || secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ inputs.environment == 'prod' && secrets.AWS_SECRET_ACCESS_KEY_PROD || inputs.environment == 'staging' && secrets.AWS_SECRET_ACCESS_KEY_STAGING || secrets.AWS_SECRET_ACCESS_KEY }}
      - run: pip install boto3==1.43.118 pillow==13.0.0
      - run: python scripts/pipeline_common.py --output artifacts/aws.json
      - name: Download verified real data and run SageMaker training
        env:
          TRAINING_TASK: ${{ inputs.task }}
        run: python mlops/run_public_training.py --config artifacts/aws.json --task "$TRAINING_TASK"
      - name: Publish actual job names, artifacts and evaluation results
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('artifacts/public-training-report.json')
          if path.exists():
              report=json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## Real public-data SageMaker training\n\n')
                  f.write('Open SageMaker AI in ap-southeast-2 and find the reported names under Processing jobs (jobType processing) or Training jobs (jobType training).\n\n')
                  f.write('```json\n'+json.dumps(report,indent=2)+'\n```\n')
                  f.write('Real external data benchmarks remain pending. No workshop stock, live model or live forecast was changed.\n')
          PY
