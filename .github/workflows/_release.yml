# Reusable: build the release for one environment.
# Pushes immutable images to ECR, renders the environment's Kustomize overlay
# (image digests, Terraform outputs, model bundle) and stages the frontend,
# then commits the overlay to main. Argo CD deploys from that commit (GitOps).
name: _release
on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      model_package:
        type: string
        default: ''
        description: Approved Model Registry version to release; empty keeps the current or baseline model
    outputs:
      sha:
        description: Commit that holds the rendered overlay (the one Argo CD must sync)
        value: ${{ jobs.release.outputs.sha }}
env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: stocklane-${{ inputs.environment }}
  TF_ENVIRONMENT: ${{ inputs.environment }}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-release
    permissions:
      contents: write
      id-token: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Check out the main branch (not the triggering commit) so the release
      # commit can be pushed on top of earlier release commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: main}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22'}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/install_kustomize.py --directory "$RUNNER_TEMP/stocklane-tools"
      - run: echo "$RUNNER_TEMP/stocklane-tools" >> "$GITHUB_PATH"
      - name: Download the checksum-pinned baseline model
        run: |
          pip install onnx==1.23.2
          python scripts/download_model.py
      - uses: ./.github/actions/aws-credentials
        with:
          role: github-release
          access-key-id: ${{ inputs.environment == 'prod' && secrets.AWS_ACCESS_KEY_ID_PROD || inputs.environment == 'staging' && secrets.AWS_ACCESS_KEY_ID_STAGING || secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ inputs.environment == 'prod' && secrets.AWS_SECRET_ACCESS_KEY_PROD || inputs.environment == 'staging' && secrets.AWS_SECRET_ACCESS_KEY_STAGING || secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Read the Terraform outputs of this environment
        run: python scripts/pipeline_common.py --output artifacts/aws.json
      - name: Sign in to ECR
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - name: Build images, render the overlay and stage the frontend
        env:
          MODEL_PACKAGE: ${{ inputs.model_package }}
        run: python scripts/build_release.py --config artifacts/aws.json --model-package "$MODEL_PACKAGE"
      - id: commit
        name: Commit the rendered overlay (GitOps)
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          git config user.name "stocklane-release"
          git config user.email "stocklane-release@users.noreply.github.com"
          git add deploy/kubernetes
          if git diff --cached --quiet; then
            echo "Overlay unchanged"
          else
            git commit -m "release($TARGET): ${GITHUB_SHA::12} [skip ci]"
            # Another environment may have released meanwhile; each environment
            # only touches its own overlay, so a rebase never conflicts.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              git pull --rebase origin main
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
