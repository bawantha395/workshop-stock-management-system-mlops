name: Review SageMaker model
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      package_arn:
        description: Model package ARN from the training summary; review its metrics first
        required: true
        type: string
      decision:
        type: choice
        options: [Approved, Rejected]
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-model-review-${{ inputs.environment }}
  cancel-in-progress: false
env:
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: stocklane-${{ inputs.environment }}
  TF_ENVIRONMENT: ${{ inputs.environment }}
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-training
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: ./.github/actions/aws-credentials
        with:
          role: github-training
          access-key-id: ${{ inputs.environment == 'prod' && secrets.AWS_ACCESS_KEY_ID_PROD || inputs.environment == 'staging' && secrets.AWS_ACCESS_KEY_ID_STAGING || secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ inputs.environment == 'prod' && secrets.AWS_SECRET_ACCESS_KEY_PROD || inputs.environment == 'staging' && secrets.AWS_SECRET_ACCESS_KEY_STAGING || secrets.AWS_SECRET_ACCESS_KEY }}
      - run: pip install boto3==1.43.118
      - run: python scripts/pipeline_common.py --output artifacts/aws.json
      - name: Record explicit model review
        env:
          PACKAGE_ARN: ${{ inputs.package_arn }}
          DECISION: ${{ inputs.decision }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0,'mlops')
          from review_model import review
          c=json.load(open('artifacts/aws.json'))['deployment']['value']
          review(os.environ['PACKAGE_ARN'],os.environ['DECISION'],c)
          PY
