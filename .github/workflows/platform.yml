name: Bootstrap EKS platform
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Validate platform]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aws-platform-${{ vars.PROJECT_NAME }}
  cancel-in-progress: false
env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT || 'dev' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_IN_AUTOMATION: 'true'
  AWS_PAGER: ''
  STOCKLANE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  eligibility:
    if: >-
      vars.AWS_ACCOUNT_ID != '' && vars.PROJECT_NAME != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ env.STOCKLANE_SOURCE_SHA }}', fetch-depth: 2}
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/workflow_eligibility.py --kind platform
  platform:
    needs: eligibility
    if: github.ref == 'refs/heads/main' && needs.eligibility.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: aws-platform
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ env.STOCKLANE_SOURCE_SHA }}'}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install -r scripts/requirements.txt

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-github-platform', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
      - run: python scripts/install_kustomize.py --directory "$RUNNER_TEMP/stocklane-tools"
      - run: python scripts/pipeline_platform.py
  frontend:
    needs: platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Publish the reviewed frontend after backend readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-frontend.yml --repo "$GITHUB_REPOSITORY" --ref main

