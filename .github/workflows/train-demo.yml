name: Train demo ML models
on:
  workflow_dispatch:
    inputs:
      task:
        description: SYNTHETIC demo jobs only; no live model release
        type: choice
        options: [both, photo, forecast]
        default: both
      seed:
        description: Change this number to generate another reproducible dummy dataset
        type: string
        default: '20261027'
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-training
  cancel-in-progress: false
env:
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT || 'dev' }}
jobs:
  demo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-training
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Authenticate to AWS with GitHub OIDC
        if: vars.AWS_AUTH_MODE != 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-github-training', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Assume delivery role with restricted CI user
        if: vars.AWS_AUTH_MODE == 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-github-training', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          force-skip-oidc: true
          role-skip-session-tagging: true
          role-session-name: stocklane-${{ github.run_id }}
      - run: pip install boto3==1.43.118 pillow==13.0.0
      - run: python scripts/pipeline_common.py --output artifacts/aws.json
      - name: Generate data and run bounded SageMaker demos
        env:
          DEMO_TASK: ${{ inputs.task }}
          DEMO_SEED: ${{ inputs.seed }}
        run: python mlops/run_demo_training.py --config artifacts/aws.json --task "$DEMO_TASK" --seed "$DEMO_SEED"
      - name: Publish clearly labelled demo summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('artifacts/demo-training-report.json')
          if path.exists():
              report=json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## Synthetic demo training — not production model evidence\n\n')
                  f.write('```json\n'+json.dumps(report,indent=2)+'\n```\n')
                  f.write('No live forecast, stock or GitOps release was changed. Demo packages cannot be approved or promoted by the production workflow.\n')
          PY
