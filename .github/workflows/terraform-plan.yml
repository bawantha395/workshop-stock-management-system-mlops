name: Plan AWS infrastructure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/aws/**'
      - 'infra/ci/**'
      - 'deploy/codebuild/**'
      - 'scripts/pipeline_*.py'
      - '.github/workflows/terraform-*.yml'
permissions:
  contents: read
concurrency:
  group: aws-infrastructure-${{ vars.PROJECT_NAME }}
  cancel-in-progress: false
env:
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT || 'dev' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_IN_AUTOMATION: 'true'
  AWS_PAGER: ''

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && vars.AWS_ACCOUNT_ID != '' && vars.PROJECT_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-infrastructure-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install -r scripts/requirements.txt
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: {terraform_version: '1.13.5', terraform_wrapper: false}
      - name: Authenticate to AWS with GitHub OIDC
        if: vars.AWS_AUTH_MODE != 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-ci-plan', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
      - name: Assume delivery role with restricted CI user
        if: vars.AWS_AUTH_MODE == 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-ci-plan', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          force-skip-oidc: true
          role-skip-session-tagging: true
          role-session-name: stocklane-${{ github.run_id }}

      - name: Generate and privately save the plan
        env:
          TFVARS_JSON: ${{ secrets.TFVARS_JSON }}
          OIDC_SUBJECT_STYLE: ${{ vars.OIDC_SUBJECT_STYLE || 'immutable' }}
        run: python scripts/pipeline_terraform.py plan

