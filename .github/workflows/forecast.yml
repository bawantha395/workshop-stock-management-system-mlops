name: Train and publish stock forecast
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish forecasts that pass the gate, or explicitly labelled baseline results
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: stock-forecast-training
  cancel-in-progress: false
env:
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT || 'dev' }}
jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-training
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Authenticate to AWS with GitHub OIDC
        if: vars.AWS_AUTH_MODE != 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-github-training', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Assume delivery role with restricted CI user
        if: vars.AWS_AUTH_MODE == 'access-key'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ format('arn:aws:iam::{0}:role/{1}-github-training', vars.AWS_ACCOUNT_ID, vars.PROJECT_NAME) }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          force-skip-oidc: true
          role-skip-session-tagging: true
          role-session-name: stocklane-${{ github.run_id }}
      - run: pip install boto3==1.43.118
      - run: python scripts/pipeline_common.py --output artifacts/aws.json
      - name: Train, evaluate and optionally publish forecast
        env:
          PUBLISH_FORECAST: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$PUBLISH_FORECAST" = "true" ]; then args+=(--publish); fi
          python mlops/run_forecast.py --config artifacts/aws.json "${args[@]}"
      - name: Publish forecast summary
        if: success()
        run: |
          python - <<'PYCODE'
          import json,os
          report=json.load(open('artifacts/forecast-report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Stock forecast result\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
              f.write('Only trained_ml rows are accepted ML. Weekday baselines and insufficient history are labelled separately. No stock was changed.\n')
          PYCODE
