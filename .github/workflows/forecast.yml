name: Train and publish stock forecast
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      publish:
        description: Publish forecasts that pass the gate, or explicitly labelled baseline results
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: stock-forecast-training-${{ inputs.environment }}
  cancel-in-progress: false
env:
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: stocklane-${{ inputs.environment }}
  TF_ENVIRONMENT: ${{ inputs.environment }}
jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-training
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: ./.github/actions/aws-credentials
        with:
          role: github-training
          access-key-id: ${{ inputs.environment == 'prod' && secrets.AWS_ACCESS_KEY_ID_PROD || inputs.environment == 'staging' && secrets.AWS_ACCESS_KEY_ID_STAGING || secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ inputs.environment == 'prod' && secrets.AWS_SECRET_ACCESS_KEY_PROD || inputs.environment == 'staging' && secrets.AWS_SECRET_ACCESS_KEY_STAGING || secrets.AWS_SECRET_ACCESS_KEY }}
      - run: pip install boto3==1.43.118
      - run: python scripts/pipeline_common.py --output artifacts/aws.json
      - name: Train, evaluate and optionally publish forecast
        env:
          PUBLISH_FORECAST: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$PUBLISH_FORECAST" = "true" ]; then args+=(--publish); fi
          python mlops/run_forecast.py --config artifacts/aws.json "${args[@]}"
      - name: Publish forecast summary
        if: success()
        run: |
          python - <<'PYCODE'
          import json,os
          report=json.load(open('artifacts/forecast-report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Stock forecast result\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
              f.write('Only trained_ml rows are accepted ML. Weekday baselines and insufficient history are labelled separately. No stock was changed.\n')
          PYCODE
