# Reusable: run the private CodeBuild runner inside the VPC.
#   bootstrap  install controllers, Argo CD and monitoring, wait until the
#              released commit is Synced/Healthy, publish API DNS, probe HTTPS
#   teardown   stop Argo CD, delete ingresses/claims so AWS removes the load
#              balancers and volumes before Terraform deletes the cluster
name: _platform
on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      operation: {type: string, default: bootstrap}
      ref:
        type: string
        default: ''
        description: Commit to deploy (the release commit); empty uses the triggering commit
env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_AUTH_MODE: ${{ vars.AWS_AUTH_MODE || 'oidc' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: stocklane-${{ inputs.environment }}
  TF_ENVIRONMENT: ${{ inputs.environment }}
  STOCKLANE_SOURCE_SHA: ${{ inputs.ref || github.sha }}
jobs:
  platform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: aws-platform
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.ref || github.sha }}'}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/install_kustomize.py --directory "$RUNNER_TEMP/stocklane-tools"
      - run: echo "$RUNNER_TEMP/stocklane-tools" >> "$GITHUB_PATH"
      - uses: ./.github/actions/aws-credentials
        with:
          role: github-platform
          access-key-id: ${{ inputs.environment == 'prod' && secrets.AWS_ACCESS_KEY_ID_PROD || inputs.environment == 'staging' && secrets.AWS_ACCESS_KEY_ID_STAGING || secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ inputs.environment == 'prod' && secrets.AWS_SECRET_ACCESS_KEY_PROD || inputs.environment == 'staging' && secrets.AWS_SECRET_ACCESS_KEY_STAGING || secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Run the private CodeBuild runner
        env:
          OPERATION: ${{ inputs.operation }}
        run: python scripts/pipeline_platform.py --operation "$OPERATION"
