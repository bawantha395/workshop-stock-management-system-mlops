name: Validate platform
on:
  workflow_dispatch:
  workflow_call:   # Deploy environment runs these checks first
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Pushes and PRs cancel older runs on the same branch; a deploy run gets its own group.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  vision-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r services/vision/requirements-dev.txt PyYAML==6.0.3 fakeredis==2.40.0 scikit-learn==1.9.1 openpyxl==3.1.5
      - run: python scripts/install_helm.py --directory "$RUNNER_TEMP/stocklane-tools"
      - run: python scripts/download_model.py
      - run: PYTHONPATH=services/vision pytest services/vision/tests tests/test_delivery_guards.py tests/test_forecast.py tests/test_automation.py tests/test_sagemaker_jobs.py tests/test_ai_lifecycle.py tests/test_alarm_rca.py tests/test_bedrock_region.py -q
      - run: python -m compileall -q scripts mlops
  database-bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stocklane
          POSTGRES_PASSWORD: postgres
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d stocklane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install -r scripts/requirements.txt 'psycopg[binary]==3.3.6' pytest==9.1.1
      - name: Check schema ownership using a non-superuser administrator
        env:
          TEST_DATABASE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/stocklane
        run: pytest tests/test_database_bootstrap.py -q
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install -r scripts/requirements.txt pytest==9.1.1
      - run: python scripts/install_helm.py --directory "$RUNNER_TEMP/stocklane-tools"
      - run: python scripts/install_helm.py --tool kubeconform --directory "$RUNNER_TEMP/stocklane-tools"
      - run: helm version --short
      - run: python scripts/validate_helm.py
      - run: pytest tests/test_helm.py -q
        env:
          STOCKLANE_REQUIRE_HELM: "1"
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive infra
      - name: Validate every environment
        run: |
          for env in dev staging prod; do
            terraform -chdir=infra/terraform/environments/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/environments/$env validate
          done
      - name: Plan every environment against mocked AWS
        run: |
          for env in dev staging prod; do
            terraform -chdir=infra/terraform/environments/dev test -var-file=../$env/terraform.tfvars
          done
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: {terraform_version: '1.13.5', terraform_wrapper: false}
      - run: pip install -r scripts/requirements-ci.txt
      - run: python scripts/install_actionlint.py --directory "$RUNNER_TEMP/stocklane-tools"
      - run: actionlint -color=false
      - run: cfn-lint -i W2001 -t infra/ci/identity.json infra/ci/state.json
      - run: pytest tests/test_pipeline.py tests/test_teardown.py tests/test_backend_structure.py tests/test_domains.py tests/test_textract_wiring.py -q
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: '1'
